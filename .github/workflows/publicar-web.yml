name: Publicar demonstração Web (Godot 4.7.2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2 e export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2"
          RELEASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          curl -fL --retry 3 "${RELEASE}/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "${RELEASE}/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          godot --version

      - name: Importar recursos
        run: godot --headless --path . --editor --import --quit

      - name: Exportar versão Web
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          touch build/web/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
